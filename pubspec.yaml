name: blog_app
description: "Blog App - Supabase Database Course Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming & Error Handling
  dartz: ^0.10.1

  # UI Components
  cupertino_icons: ^1.0.6
  pinput: ^5.0.1

  # Image Picker
  image_picker: ^1.0.4

  # HTTP
  http: ^1.1.0

  #Firebase
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: ^14.0.0
  cloud_functions: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_crashlytics: ^6.0.0
  
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^6.0.0

  google_sign_in: ^7.2.0

  # Date Formatting
  intl: ^0.19.0
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
